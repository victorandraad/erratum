name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Sanidade do FTS5
        run: python -c "import sqlite3; sqlite3.connect(':memory:').execute('create virtual table t using fts5(x)'); print(sqlite3.sqlite_version)"
      - name: Identidade do git para os testes dos portões
        run: |
          git config --global user.email "ci@example.test"
          git config --global user.name "ci"
      - name: Testes
        run: python -m unittest -v
      - name: Portões no diff do pull request
        if: github.event_name == 'pull_request'
        env:
          ERRATUM_DB: ${{ runner.temp }}/erratum-ci.db
        run: python -m erratum gate em-dash,stub-neutro,fix-noop --base origin/main --test-cmd "python -B -m unittest"
