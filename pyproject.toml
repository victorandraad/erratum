[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "erratum-cli"
version = "0.1.0"
description = "Portões que provam que a correção conserta, e um ledger local para não resolver o mesmo erro duas vezes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/victorandraad/erratum"
Issues = "https://github.com/victorandraad/erratum/issues"

[project.scripts]
erratum = "erratum.cli:main"

[tool.setuptools]
packages = ["erratum"]

[tool.setuptools.package-data]
erratum = ["sementes.json", "receitas.json"]
