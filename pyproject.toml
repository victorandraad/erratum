[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "erratum"
version = "0.1.0"
description = "Ledger local de erros e acertos: registre o erro, ache a correção, repita o acerto."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
erratum = "erratum.cli:main"

[tool.setuptools]
packages = ["erratum"]
