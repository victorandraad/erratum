[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "erratum-cli"
version = "0.1.0"
description = "Gates that prove the fix actually fixes, and a local ledger so the same error is not solved twice."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
erratum = "erratum.cli:main"

[tool.setuptools]
packages = ["erratum"]

[tool.setuptools.package-data]
erratum = ["sementes.json", "receitas.json"]
